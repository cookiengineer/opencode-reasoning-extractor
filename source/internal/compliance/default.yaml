version: 1
thresholds:
  score: 1.5
field_weights:
  assistant_text: 1.0
  reasoning: 0.5
patterns:
  # Strong signals are unambiguous policy denials. They are anchored to a
  # sentence start (see strongAnchor in compliance.go) so a quoted example or a
  # slide listing a refusal does not count. One hit in assistant text (weight
  # 1.0, scored x2) crosses the threshold on its own.
  strong:
    # Apology followed by an explicit inability to help.
    - "i'?m sorry,? (but )?i (can'?t|cannot|won'?t|will not|am unable to|am not able to)"
    - "i apologize,? (but )?i (can'?t|cannot|won'?t|will not|am unable to)"
    - "sorry,? (but )?i (can'?t|cannot|won'?t|will not)"
    - "i'?m afraid (that )?i (can'?t|cannot|won'?t)"
    # Direct denial of helping / assisting / complying.
    - "i (cannot|can'?t|won'?t|will not) (assist|comply|engage|participate|fulfill)"
    - "i (cannot|can'?t|won'?t|will not) help (you|with|him|her|them|there|that|this|any|to|build|write|create|develop|make|craft|design|do)"
    - "i (cannot|can'?t|won'?t|will not) provide (you|with|him|her|them|there|that|this|any)"
    - "i (am unable to|am not able to|'?m unable to|'?m not able to) (help|assist|provide|comply|engage|participate|fulfill)"
    - "i won'?t be able to (help|assist|provide|comply|fulfill)"
    - "i'?m not going to (help|assist|provide|comply|engage|participate)"
    # Explicit decline / refusal, scoped to the request itself so plan-mode
    # phrasings like "I must decline saving" do not match.
    - "i (must|have to|will have to|am going to have to) (decline|refuse) (this|that|the|your) (request|task|instruction)"
    - "i (respectfully |regretfully )?(decline|refuse) (this|that|the|your) (request|task|instruction)"
    - "i refuse to (help|assist|provide|comply|engage|participate|write|create|generate|do)"
    - "i will not (help|assist|provide|comply|engage|participate)"
    - "i (can'?t|cannot|won'?t) in good conscience"
    - "i cannot and will not"
    - "not something i (can|will|am able to|am willing to|'?m willing to)"
    # Policy / ethics justifications.
    - "(this|that|it) (is|would be|goes) against my (guidelines|policy|policies|principles|values|ethics)"
    - "(this|that|it) (violates|breach(es)?) my (guidelines|policy|policies|principles|values)"
    - "(this|that|the) (request|task|instruction) (is|would be|seems) (unethical|illegal|harmful|unlawful)"
    - "(that|this) would be (unethical|illegal|harmful|unlawful)"
    - "i (can'?t|cannot|won'?t) (assist|help) with (illegal|unethical|harmful)"
    - "i (can'?t|cannot|won'?t) (write|create|generate|provide) (malicious|malware|a virus|ransomware|an exploit)"
    - "(this|that|it) falls outside (the|my) (scope|guidelines|policy)"
    # Unable to fulfill / answer the request.
    - "i (cannot|can'?t|won'?t|am unable to) (fulfill|answer|respond to|address) (this|that|the)"
    - "i'?m unable to (fulfill|answer|respond to|address)"
    # Chinese.
    - "抱歉.{0,12}(无法|不能|不会|不便)"
    - "对不起.{0,12}(无法|不能|不会|不便)"
    - "很抱歉.{0,12}(无法|不能|不会)"
    - "我(无法|不能|不会|不便)(帮助|提供|协助|满足|回答|参与|支持|完成)"
    - "我(拒绝|恕难)(提供|协助|帮助|从命)"
    - "这(违反|不符合|超出)了?(我|我的)?(原则|规定|准则|范围|能力)"
    - "恕难从命"
    - "我不能这么做"
  # Weak signals are supporting phrases. They are deliberately narrow: broad
  # deliberation phrases such as "i should not" / "i must not" are excluded
  # because agents use them constantly for ordinary planning. They only trip
  # the threshold when several accumulate or co-occur with a strong signal.
  weak:
    - "as an ai"
    - "i'?m not (comfortable|willing)"
    - "i (am not|'?m not) (comfortable|willing) (with|to)"
    - "i don'?t (feel comfortable|feel able)"
    - "i don'?t have the ability to"
    - "not something i (can|will) help with"
    - "i'?m not the right"
    - "我不能帮着"
    - "我没有能力"
    - "这不太合适"
